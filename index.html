<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=home/index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS CRP Homework 9 Portal</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff007f, #7928ca, #0070f3, #00dfd8);
      background-size: 300% 300%;
      animation: shiftGrad 6s ease infinite;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    @keyframes shiftGrad {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.4);
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      max-width: 480px;
    }
    a.btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.9rem 2rem;
      background: linear-gradient(90deg, #ff007f, #ff7b00, #ffdd00);
      color: #000;
      font-weight: 800;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(255, 123, 0, 0.4);
      transition: transform 0.2s;
    }
    a.btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌈 CS CRP Homework 9</h1>
    <p>Opening the Interactive Project Hub...</p>
    <a href="home/index.html" class="btn">Enter Rainbow Hub ⚡</a>
  </div>
</body>
</html>
